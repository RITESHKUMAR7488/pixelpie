
<svg width="100%" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sqLin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FF3B47"/>
      <stop offset="30%"  stop-color="#E50914"/>
      <stop offset="65%"  stop-color="#B0000F"/>
      <stop offset="100%" stop-color="#5C0008"/>
    </linearGradient>
    <radialGradient id="sqBloom" cx="28%" cy="25%" r="60%">
      <stop offset="0%"   stop-color="#FF6070" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#E50914" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sqVig" cx="88%" cy="88%" r="55%">
      <stop offset="0%"   stop-color="#1a0004" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chipLin" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#BF3A00"/>
      <stop offset="45%"  stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#FFD180"/>
    </linearGradient>
    <radialGradient id="chipBloom" cx="22%" cy="22%" r="68%">
      <stop offset="0%"   stop-color="#FFE0A0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF5722" stop-opacity="0"/>
    </radialGradient>

    <filter id="ambWide" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="ambMid" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="sqGlow" x="-28%" y="-28%" width="156%" height="156%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="chipGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="sqClip">
      <rect x="156" y="136" width="136" height="136" rx="11"/>
    </clipPath>
    <clipPath id="chipClip">
      <rect x="246" y="194" width="54" height="54" rx="8"/>
    </clipPath>
  </defs>

  <!-- BG -->
  <rect width="680" height="420" fill="#080808"/>

  <!-- ── ENTIRE LOGO GROUP — fades in from nothing ── -->
  <g id="logoAll" opacity="0">
    <animateTransform attributeName="transform" type="scale"
      from="0.82 0.82" to="1 1"
      dur="1.1s" begin="0.1s" fill="freeze"
      additive="sum"
      calcMode="spline" keySplines="0.16 1 0.3 1"/>
    <animate attributeName="opacity"
      from="0" to="1"
      dur="0.9s" begin="0.1s" fill="freeze"
      calcMode="spline" keySplines="0.16 1 0.3 1"/>

    <!-- transform-origin workaround: translate to center, scale, translate back -->
    <g transform="translate(340,210)">
      <g transform="translate(-340,-210)">

        <!-- AMBIENT POOLS with pulse -->
        <ellipse cx="222" cy="204" rx="105" ry="100" fill="#E50914" opacity="0" filter="url(#ambWide)">
          <animate attributeName="opacity" values="0;0.18;0.14;0.18" dur="4s" begin="1.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
        </ellipse>
        <ellipse cx="215" cy="196" rx="62" ry="60" fill="#FF2828" opacity="0" filter="url(#ambMid)">
          <animate attributeName="opacity" values="0;0.14;0.10;0.14" dur="4s" begin="1.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
        </ellipse>
        <ellipse cx="278" cy="230" rx="64" ry="60" fill="#FF5520" opacity="0" filter="url(#ambWide)">
          <animate attributeName="opacity" values="0;0.18;0.13;0.18" dur="5s" begin="1.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
        </ellipse>
        <ellipse cx="270" cy="222" rx="36" ry="35" fill="#FFAA40" opacity="0" filter="url(#ambMid)">
          <animate attributeName="opacity" values="0;0.13;0.08;0.13" dur="5s" begin="1.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
        </ellipse>

        <!-- ── MAIN RED SQUARE — slides in from left ── -->
        <g opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
          <animateTransform attributeName="transform" type="translate" from="-28 0" to="0 0" dur="0.85s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>

          <rect x="156" y="136" width="136" height="136" rx="11" fill="#C0000C" opacity="0.45" filter="url(#sqGlow)"/>
          <rect x="156" y="136" width="136" height="136" rx="11" fill="url(#sqLin)"/>
          <rect x="156" y="136" width="136" height="136" rx="11" fill="url(#sqBloom)"/>
          <rect x="156" y="136" width="136" height="136" rx="11" fill="url(#sqVig)"/>
          <rect x="157" y="137" width="134" height="30" rx="10" fill="rgba(255,255,255,0.07)" clip-path="url(#sqClip)"/>
          <rect x="156" y="136" width="136" height="136" rx="11" fill="none" stroke="rgba(255,110,90,0.3)" stroke-width="1"/>

          <!-- Subtle breathe on the square -->
          <rect x="156" y="136" width="136" height="136" rx="11" fill="#FF2020" opacity="0">
            <animate attributeName="opacity" values="0;0.06;0;0.06;0" dur="3.5s" begin="1.5s" repeatCount="indefinite"/>
          </rect>
        </g>

        <!-- ── CHIP — detaches and floats up from square ── -->
        <g opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.85s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
          <!-- Chip starts at resting position inside square area then pops out -->
          <animateTransform attributeName="transform" type="translate"
            from="18 18" to="0 0"
            dur="0.75s" begin="0.85s" fill="freeze"
            calcMode="spline" keySplines="0.16 1 0.3 1"/>

          <rect x="246" y="194" width="54" height="54" rx="8" fill="#FF5520" opacity="0.5" filter="url(#chipGlow)"/>
          <rect x="246" y="194" width="54" height="54" rx="8" fill="url(#chipLin)"/>
          <rect x="246" y="194" width="54" height="54" rx="8" fill="url(#chipBloom)"/>
          <rect x="247" y="195" width="52" height="18" rx="7" fill="rgba(255,255,255,0.11)" clip-path="url(#chipClip)"/>
          <rect x="246" y="194" width="54" height="54" rx="8" fill="none" stroke="rgba(255,210,120,0.32)" stroke-width="1"/>

          <!-- Chip continuous float -->
          <animateTransform attributeName="transform" type="translate"
            values="0,0; 0,-5; 0,0"
            dur="3.8s" begin="1.8s" repeatCount="indefinite"
            calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
        </g>

        <!-- ── WORDMARK — each part staggers in ── -->

        <!-- Vertical rule draws down -->
        <rect x="330" y="155" width="1" height="0" rx="1" fill="#E50914" opacity="0.28">
          <animate attributeName="height" from="0" to="112" dur="0.6s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
        </rect>

        <!-- EST. NEW DELHI -->
        <text x="348" y="168"
          font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
          font-size="9" font-weight="400"
          fill="#E50914" opacity="0" letter-spacing="4">
          EST. NEW DELHI
          <animate attributeName="opacity" from="0" to="0.55" dur="0.5s" begin="0.9s" fill="freeze"/>
        </text>

        <!-- PIXEL -->
        <text x="348" y="211"
          font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
          font-size="43" font-weight="900"
          fill="#ffffff" letter-spacing="1" opacity="0">
          PIXEL
          <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.95s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
          <animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" dur="0.55s" begin="0.95s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" additive="sum"/>
        </text>

        <!-- PIE -->
        <text x="348" y="253"
          font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
          font-size="43" font-weight="900"
          fill="#E50914" letter-spacing="1" opacity="0">
          PIE
          <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.1s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
          <animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" dur="0.55s" begin="1.1s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" additive="sum"/>
        </text>

        <!-- Rule under PIE -->
        <rect x="348" y="260" width="0" height="0.75" fill="#E50914" opacity="0.22" rx="1">
          <animate attributeName="width" from="0" to="168" dur="0.5s" begin="1.25s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
        </rect>

        <!-- MEDIA -->
        <text x="349" y="276"
          font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
          font-size="12" font-weight="300"
          fill="#505050" letter-spacing="7" opacity="0">
          MEDIA
          <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.3s" fill="freeze"/>
        </text>

        <!-- Tagline rule -->
        <rect x="156" y="300" width="0" height="0.5" fill="#E50914" opacity="0.1" rx="1">
          <animate attributeName="width" from="0" to="366" dur="0.8s" begin="1.5s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
        </rect>

        <!-- Tagline text -->
        <text x="339" y="316"
          font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
          font-size="9" font-weight="400"
          fill="#2a2a2a" letter-spacing="5"
          text-anchor="middle" opacity="0">
          WE BUILD CULTURE
          <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.6s" fill="freeze"/>
        </text>

        <!-- Corner marks — appear last -->
        <g opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.7s" fill="freeze"/>
          <rect x="156" y="130" width="10" height="1.5" fill="#E50914" opacity="0.35"/>
          <rect x="156" y="130" width="1.5" height="10" fill="#E50914" opacity="0.35"/>
          <rect x="282" y="130" width="10" height="1.5" fill="#E50914" opacity="0.35"/>
          <rect x="290.5" y="130" width="1.5" height="10" fill="#E50914" opacity="0.35"/>
          <rect x="156" y="271" width="1.5" height="10" fill="#E50914" opacity="0.35"/>
          <rect x="156" y="279" width="10" height="1.5" fill="#E50914" opacity="0.35"/>
        </g>

      </g>
    </g>
  </g>
</svg>
